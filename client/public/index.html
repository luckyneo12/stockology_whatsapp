<!doctype html><html lang="en"><head><script>
(function(){
  try {
    var isEmbedded = false;
    try {
      isEmbedded = window.self !== window.top;
    } catch(err) {
      isEmbedded = true;
    }

    var params = new URLSearchParams(window.location.search);
    if (params.get("embedded") === "true" || params.get("hide_nav") === "true") {
      isEmbedded = true;
    }

    if (isEmbedded) {
      document.documentElement.classList.add("is-embedded-hub");

      var style = document.createElement("style");
      style.id = "wacrm-embed-clean-css";
      style.textContent = `
        html.is-embedded-hub,
        html.is-embedded-hub body,
        html.is-embedded-hub #root {
          margin: 0 !important;
          padding: 0 !important;
          height: 100vh !important;
          max-height: 100vh !important;
          overflow: hidden !important;
          background: #ffffff !important;
        }

        html.is-embedded-hub nav,
        html.is-embedded-hub .MuiDrawer-root,
        html.is-embedded-hub .MuiDrawer-docked,
        html.is-embedded-hub [role="navigation"] {
          display: none !important;
          width: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }

        html.is-embedded-hub header,
        html.is-embedded-hub .MuiAppBar-root,
        html.is-embedded-hub .MuiToolbar-root,
        html.is-embedded-hub main > div[style*="position: sticky"],
        html.is-embedded-hub main > div[style*="position:sticky"],
        html.is-embedded-hub main > div:first-child:not([style*="padding"]) {
          display: none !important;
          height: 0 !important;
          min-height: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }

        html.is-embedded-hub main {
          padding: 0 !important;
          margin: 0 !important;
          width: 100vw !important;
          max-width: 100vw !important;
          height: 100vh !important;
          max-height: 100vh !important;
          min-width: 0 !important;
          overflow: hidden !important;
        }

        html.is-embedded-hub main > div,
        html.is-embedded-hub main > div > div {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          height: 100% !important;
          max-height: 100% !important;
        }

        html.is-embedded-hub .MuiBox-root[style*="calc(100vh"],
        html.is-embedded-hub div[style*="calc(100vh"] {
          height: 100vh !important;
          max-height: 100vh !important;
          border-radius: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }
      `;
      document.head.appendChild(style);

      function enforceCleanEmbedded() {
        var navs = document.querySelectorAll("nav, .MuiDrawer-root, header, .MuiAppBar-root");
        for (var i = 0; i < navs.length; i++) {
          navs[i].style.setProperty("display", "none", "important");
        }
        var mains = document.querySelectorAll("main");
        for (var j = 0; j < mains.length; j++) {
          var m = mains[j];
          m.style.setProperty("padding", "0px", "important");
          m.style.setProperty("margin", "0px", "important");
          m.style.setProperty("width", "100%", "important");
          m.style.setProperty("height", "100vh", "important");
          m.style.setProperty("max-height", "100vh", "important");
          for (var k = 0; k < m.children.length; k++) {
            var child = m.children[k];
            var computed = window.getComputedStyle(child);
            if (computed.position === "sticky" || (child.getAttribute("style") && child.getAttribute("style").indexOf("sticky") !== -1)) {
              child.style.setProperty("display", "none", "important");
            }
          }
        }
        var divs = document.querySelectorAll("main, main div");
        for (var d = 0; d < divs.length; d++) {
          var el = divs[d];
          var comp = window.getComputedStyle(el);
          if (el.tagName === "MAIN" || (el.parentElement && el.parentElement.tagName === "MAIN") || (el.parentElement && el.parentElement.parentElement && el.parentElement.parentElement.tagName === "MAIN")) {
            if (comp.paddingLeft !== "0px" || comp.paddingTop !== "0px" || comp.paddingBottom !== "0px" || comp.paddingRight !== "0px") {
              el.style.setProperty("padding", "0px", "important");
              el.style.setProperty("margin", "0px", "important");
            }
          }
          if (comp.display === "flex" && parseInt(comp.borderRadius || "0", 10) >= 8) {
            el.style.setProperty("border-radius", "0px", "important");
            el.style.setProperty("border", "none", "important");
            el.style.setProperty("box-shadow", "none", "important");
            el.style.setProperty("height", "100vh", "important");
            el.style.setProperty("max-height", "100vh", "important");
          }
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", enforceCleanEmbedded);
      } else {
        enforceCleanEmbedded();
      }

      var observer = new MutationObserver(enforceCleanEmbedded);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    }

    var token = params.get("sso_token");
    var role = params.get("sso_role") || "user";
    if (token) {
      if (role === "admin") {
        localStorage.setItem("wacrm_admin", token);
      } else if (role === "agent") {
        localStorage.setItem("wacrm_agent", token);
      } else {
        localStorage.setItem("wacrm_user", token);
      }
      var targetPath = role === "admin" ? "/admin" : role === "agent" ? "/agent" : "/user";
      params.delete("sso_token");
      params.delete("sso_role");
      if (isEmbedded) {
        params.set("embedded", "true");
      }
      var rest = params.toString();
      var cleanUrl = targetPath + (rest ? "?" + rest : "") + window.location.hash;
      if (window.location.pathname !== targetPath) {
        window.location.replace(cleanUrl);
      } else {
        window.history.replaceState({}, document.title, cleanUrl);
      }
    }
  } catch(e) {}
})();
